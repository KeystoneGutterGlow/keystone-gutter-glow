<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700">
  <!-- Wood grain for the dark sections: noise stretched along the board, in darker and lighter streaks. -->
  <filter id="dark" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.09" numOctaves="4" seed="8" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.06  0 0 0 0 0.03  0 0 0 0 0.01  0.9 0 0 0 -0.34"/>
  </filter>
  <filter id="light" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.17" numOctaves="3" seed="21" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.42  0 0 0 0 0.26  0 1.3 0 0 -0.62"/>
  </filter>
  <rect width="1400" height="700" fill="#2b1a14"/>
  <rect width="1400" height="700" filter="url(#dark)"/>
  <rect width="1400" height="700" filter="url(#light)" opacity="0.09"/>
  <path d="M0 233.5H1400M0 466.5H1400" stroke="#120a06" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M0 235.5H1400M0 468.5H1400" stroke="#6b4a33" stroke-opacity="0.22"/>
</svg>
